<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis Core — demo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e5e4e2; }
      #canvas-container { width: 100%; height: 100%; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="canvas-container"></div>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const container = document.getElementById("canvas-container");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#e5e4e2");
      scene.fog = new THREE.FogExp2("#e5e4e2", 0.05);

      const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 0, 5);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.0;
      controls.minDistance = 3;
      controls.maxDistance = 10;

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
      mainLight.position.set(5, 10, 7);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.set(2048, 2048);
      mainLight.shadow.bias = -0.0001;
      scene.add(mainLight);
      const fill = new THREE.DirectionalLight(0xccddff, 1.0);
      fill.position.set(-5, 3, -5);
      scene.add(fill);
      const rim = new THREE.PointLight(0xffffff, 2);
      rim.position.set(0, 5, -5);
      scene.add(rim);

      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(50, 50),
        new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.15 }),
      );
      plane.rotation.x = -Math.PI / 2;
      plane.position.y = -1.5;
      plane.receiveShadow = true;
      scene.add(plane);

      const noise3D = `
        vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
        vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
        float snoise(vec3 v){
          const vec2 C = vec2(1.0/6.0, 1.0/3.0);
          const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
          vec3 i  = floor(v + dot(v, C.yyy));
          vec3 x0 = v - i + dot(i, C.xxx);
          vec3 g = step(x0.yzx, x0.xyz);
          vec3 l = 1.0 - g;
          vec3 i1 = min(g.xyz, l.zxy);
          vec3 i2 = max(g.xyz, l.zxy);
          vec3 x1 = x0 - i1 + 1.0 * C.xxx;
          vec3 x2 = x0 - i2 + 2.0 * C.xxx;
          vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
          i = mod(i, 289.0);
          vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
            + i.y + vec4(0.0, i1.y, i2.y, 1.0))
            + i.x + vec4(0.0, i1.x, i2.x, 1.0));
          float n_ = 1.0/7.0;
          vec3 ns = n_ * D.wyz - D.xzx;
          vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
          vec4 x_ = floor(j * ns.z);
          vec4 y_ = floor(j - 7.0 * x_);
          vec4 x = x_ * ns.x + ns.yyyy;
          vec4 y = y_ * ns.x + ns.yyyy;
          vec4 h = 1.0 - abs(x) - abs(y);
          vec4 b0 = vec4(x.xy, y.xy);
          vec4 b1 = vec4(x.zw, y.zw);
          vec4 s0 = floor(b0) * 2.0 + 1.0;
          vec4 s1 = floor(b1) * 2.0 + 1.0;
          vec4 sh = -step(h, vec4(0.0));
          vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
          vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
          vec3 p0 = vec3(a0.xy, h.x);
          vec3 p1 = vec3(a0.zw, h.y);
          vec3 p2 = vec3(a1.xy, h.z);
          vec3 p3 = vec3(a1.zw, h.w);
          vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
          p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
          vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
          m = m * m;
          return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
        }
      `;

      const innerUniforms = {
        time: { value: 0 },
        noiseScale: { value: 3.0 },
        displacementScale: { value: 0.15 },
        stripesFrequency: { value: 20.0 },
        colorBase: { value: new THREE.Color("#0a4f52") },
        colorDark: { value: new THREE.Color("#032224") },
        colorHighlight: { value: new THREE.Color("#1f7a7d") },
      };

      const innerMaterial = new THREE.ShaderMaterial({
        vertexShader: `
          precision highp float;
          ${noise3D}
          uniform float time;
          uniform float noiseScale;
          uniform float displacementScale;
          uniform float stripesFrequency;
          varying vec3 vNormal;
          varying float vNoise;
          void main() {
            vNormal = normal;
            float yStripes = sin(position.y * stripesFrequency);
            vec3 noisePos = position * noiseScale + time * 0.1;
            float noise = snoise(noisePos);
            vNoise = noise;
            float displacement = (yStripes * 0.5 + noise * 0.5) * displacementScale;
            float polarMask = smoothstep(1.0, 0.5, abs(position.y));
            vec3 newPosition = position + normal * (displacement * polarMask);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
          }
        `,
        fragmentShader: `
          precision highp float;
          uniform vec3 colorBase;
          uniform vec3 colorDark;
          uniform vec3 colorHighlight;
          varying vec3 vNormal;
          varying float vNoise;
          void main() {
            vec3 lightDirection = normalize(vec3(1.0, 1.0, 1.0));
            float diffuse = max(dot(normalize(vNormal), lightDirection), 0.0);
            float mixFactor = (vNoise + 1.0) * 0.5;
            vec3 finalColor = mix(colorDark, colorBase, mixFactor);
            finalColor = mix(finalColor, colorHighlight, diffuse * 0.5);
            gl_FragColor = vec4(finalColor, 1.0);
          }
        `,
        uniforms: innerUniforms,
        depthWrite: true,
      });

      const innerSphere = new THREE.Mesh(new THREE.SphereGeometry(0.85, 256, 256), innerMaterial);
      scene.add(innerSphere);

      const outerMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x002233,
        metalness: 0.1,
        roughness: 0.05,
        transmission: 0.95,
        ior: 1.5,
        thickness: 0.5,
        attenuationColor: new THREE.Color("#18575a"),
        attenuationDistance: 0.5,
        clearcoat: 1.0,
        clearcoatRoughness: 0.0,
        envMapIntensity: 2.0,
      });
      const outerSphere = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 96), outerMaterial);
      outerSphere.castShadow = true;
      scene.add(outerSphere);

      const clock = new THREE.Clock();
      function onResize() {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      }
      addEventListener("resize", onResize);

      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        innerUniforms.time.value = t * 0.2;
        innerSphere.rotation.y = t * 0.1;
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
